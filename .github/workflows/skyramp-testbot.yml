name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot'))
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      # Generate a GitHub App installation token to retrigger CI workflows on push
      # https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/making-authenticated-api-requests-with-a-github-app-in-a-github-actions-workflow
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Start Mealie and fetch test bearer token
        run: |
          set -euo pipefail

          # Bring up the Mealie target via the shared compose file and wait
          # for the API to respond to /api/app/about (loud failure on timeout).
          bash .skyramp/start-mealie.sh

          # Log in as Mealie's bootstrap admin (changeme@example.com / MyPassword,
          # auto-created on first boot) and export the bearer token to GITHUB_ENV
          # so the skyramp/testbot action can read it via env.
          SKYRAMP_TEST_TOKEN=$(curl -fsS -X POST http://localhost:9000/api/auth/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'username=changeme%40example.com&password=MyPassword' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          if [[ -z "${SKYRAMP_TEST_TOKEN}" ]]; then
            echo "Failed to obtain bearer token from Mealie" >&2
            exit 1
          fi
          echo "::add-mask::${SKYRAMP_TEST_TOKEN}"
          echo "SKYRAMP_TEST_TOKEN=${SKYRAMP_TEST_TOKEN}" >> "${GITHUB_ENV}"

      - uses: skyramp/testbot@v0.8.2
        env:
          SKYRAMP_TEST_TOKEN: ${{ env.SKYRAMP_TEST_TOKEN }}
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.app-token.outputs.token }}
          testDirectory: tests

          # Bring Mealie up the same way as the pre-step. start-mealie.sh is
          # idempotent (compose down -v before up), so re-running here keeps
          # state predictable when the action invokes its own setup phase.
          targetSetupCommand: |
            set -euo pipefail
            bash .skyramp/start-mealie.sh

          targetReadyCheckCommand: |
            curl -fsS http://localhost:9000/api/app/about > /dev/null

          targetReadyCheckTimeout: '900'

          # Backup: regenerate a fresh bearer token if the executor needs one
          # at execution time. Kept as a SINGLE LINE because Skyramp's executor
          # runs this command directly (not through bash), so backslash line
          # continuations end up as literal '\' chars in the token value and
          # break JSON parsing later. Same single-line shape as ebikes-lwc.
          authTokenCommand: "curl -fsS -X POST http://localhost:9000/api/auth/token -H 'Content-Type: application/x-www-form-urlencoded' -d 'username=changeme%40example.com&password=MyPassword' | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"access_token\"])'"

          skipTargetTeardown: 'true'
