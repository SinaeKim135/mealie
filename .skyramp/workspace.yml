services:
  - serviceName: mealie
    testDirectory: tests
    language: python
    framework: pytest
    runtimeDetails:
      serverStartCommand: "docker run -d --name mealie -p 9000:9000 -e ALLOW_SIGNUP=true -e TOKEN_TIME=720 -e DB_ENGINE=sqlite ghcr.io/mealie-recipes/mealie:nightly"
      runtime: local
    api:
      baseUrl: http://localhost:9000
      authHeader: Authorization
      authType: bearer
