services:
  - serviceName: mealie
    testDirectory: tests
    language: python
    framework: pytest
    runtimeDetails:
      serverStartCommand: "bash .skyramp/start-mealie.sh"
      runtime: local
    api:
      baseUrl: http://localhost:9000
      authHeader: Authorization
      authType: bearer
      # Same get-token.sh used by the action's authTokenCommand and the
      # workflow pre-step — keeps the MCP generation phase, the action's
      # runtime fetch, and the pre-step env var on a single source of truth.
      authTokenCommand: "bash .skyramp/get-token.sh"
