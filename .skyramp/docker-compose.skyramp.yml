services:
  mealie:
    container_name: mealie
    # Build from the PR's source so Skyramp tests run against the code
    # under review, not against the upstream nightly image. This mirrors
    # how the ebikes-lwc reference deploys force-app from the PR branch
    # before running tests.
    build:
      context: ..
      target: production
      dockerfile: docker/Dockerfile
    ports:
      - "9000:9000"
    environment:
      ALLOW_SIGNUP: "true"
      TOKEN_TIME: "720"
      DB_ENGINE: "sqlite"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/app/about >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
