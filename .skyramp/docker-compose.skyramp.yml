services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:nightly
    container_name: mealie
    ports:
      - "9000:9000"
    environment:
      ALLOW_SIGNUP: "true"
      TOKEN_TIME: "720"
      DB_ENGINE: "sqlite"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/app/about >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
